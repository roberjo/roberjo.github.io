<!doctype html>
<html lang="en" data-theme="dark">
<head>

  <script>
    (function () {
      var t = null;
      try { t = localStorage.getItem("theme"); } catch (e) {}
      if (!t) t = window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
      document.documentElement.setAttribute("data-theme", t);
    })();
  </script>
  <style>
    .nf { min-height: 100vh; display: grid; place-items: center; padding: 24px 16px; }
    .nf .terminal { width: 100%; max-width: 560px; }
    .nf .terminal__body { min-height: 0; }
    .nf .btn { margin-top: 24px; }
  </style>
</head>
<body>
  <main class="nf">
    <div>
      <div class="terminal">
        <div class="terminal__bar">
          <span class="terminal__dot"></span><span class="terminal__dot"></span><span class="terminal__dot"></span>
          <span class="terminal__title">roberjo@cloud: ~</span>
        </div>
        <pre class="terminal__body"><span class="t-prompt">$</span> cd <span id="path">this-page</span>
<span class="t-val">cd: no such file or directory</span>
<span class="t-out"># HTTP 404: the page you're looking for isn't here.</span>
<span class="t-prompt">$</span> <span class="t-caret" aria-hidden="true"></span></pre>
      </div>
      <a class="btn btn--primary" href="/">cd ~ (back home)</a>
    </div>
  </main>
  <script>
    var p = document.getElementById("path");
    if (p && location.pathname.length > 1) p.textContent = location.pathname;
  </script>
</body>
